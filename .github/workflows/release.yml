name: Release

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    shell: powershell

jobs:
  release:
    runs-on: windows-latest
    if: vars.RELEASE_PIPELINE_ENABLED == '1'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          # full history so "sentry-cli releases set-commits --auto" can resolve the commit range
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Run Bootstrap
        run: ./bootstrap.ps1

      - name: Update version
        id: version
        run: |
          $buildNumber = 9000 + $Env:GITHUB_RUN_NUMBER
          $packageVersion = ./build-scripts/update_version.ps1 -dev $false -buildNumber $buildNumber
          echo "::set-output name=packageVersion::$packageVersion"

      # SENTRY_AUTH_TOKEN is what enables the Sentry CLI steps in "Hearthstone Deck Tracker.csproj".
      # The release name is not passed in: both sentry-cli and the SDK derive it from
      # InformationalVersion, so they cannot drift apart.
      - name: Build (Squirrel)
        run: msbuild "./Hearthstone Deck Tracker.sln" /p:Configuration=Squirrel /p:Platform="x64"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}

      - name: Setup SM_CLIENT_CERT_FILE from base64 secret data
        shell: bash
        run: |
          echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 --decode > ${RUNNER_TEMP}/sm_client_cert.p12
          echo "SM_CLIENT_CERT_FILE=${RUNNER_TEMP}/sm_client_cert.p12" >> $GITHUB_ENV

      - name: Setup Software Trust Manager
        uses: digicert/code-signing-software-trust-action@v1.0.1
        with:
          simple-signing-mode: true
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_RELEASE_REGION }}

      # signed after the Squirrel build because every solution build re-downloads the unsigned libs
      - name: Sign libraries
        shell: pwsh
        run: ./build-scripts/sign_libs.ps1 -dir "Hearthstone Deck Tracker\bin\x64\Squirrel" -bucket ${{ vars.AWS_RELEASE_LIBS_BUCKET }}
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: Package
        run: ./build-scripts/package.ps1 -dev $false -packageVersion ${{ steps.version.outputs.packageVersion }}
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: Create Release (Squirrel)
        run: ./build-scripts/github_release.ps1 -type squirrel -packageVersion ${{ steps.version.outputs.packageVersion }}
        env:
          HDT_GITHUB_TOKEN: ${{ secrets.HDT_GITHUB_TOKEN }}
